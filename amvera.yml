meta:
  environment: docker
  toolchain:
    name: docker
    version: latest

build:
  artifacts:
    - Dockerfile
    - .
  buildCommand: docker build -f Dockerfile -t med-book .

run:
  runtime:
    name: docker
    version: latest
  containerPort: 8080
  command: docker run -p 8080:8080 med-book

environment:
  - DB_HOST=localhost
  - DB_PORT=5432
  - DB_USER=atlas
  - DB_PASSWORD=123
  - DB_NAME=med_book

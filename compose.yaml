services:
  server:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - DB_DRIVER=sqlite
      - DB_DSN=/data/med_book.db?_journal_mode=WAL&_foreign_keys=1
      - JWT_SECRET=change-me-in-production
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - SERVER_PORT=8080
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Результаты теста</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        /* Временные стили для отладки */
        .register-link {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
        }
        .register-link a {
            display: inline-block;
            padding: 12px 24px;
            background-color: #667eea;
            color: white !important;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        .register-link a:hover {
            background-color: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Результаты теста</h1>
        
        <div>
            <h2>Итог: {{.correct}} из {{.total}} правильных ответов</h2>
            <p>Процент: {{printf "%.1f" .percentage}}%</p>
        </div>
        
        <hr>
        
        <div class="register-link">
            <a href="/profile">В профиль</a>
        </div>
    </div>
</body>
</html>

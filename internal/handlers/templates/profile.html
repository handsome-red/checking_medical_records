<!DOCTYPE html>

<body>
    <div class="container">
        <!-- Шапка профиля -->
        <div class="profile-header">
            <h1>{{.FirstName}}</h1>
            <h1>{{.LastName}}</h1>
            <h1>{{.Patronymic}}</h1>
            <p>Всего пройдено тестов: {{.TotalSessions}}</p>
        </div>

        <!-- Статистика -->
        <div class="stats-grid">
            <div class="stat-card">
                <!-- <div class="stat-number">{{.TotalSessions}}</div> -->
                <div class="stat-label">Пройдено тестов</div>
            </div>
            <div class="stat-card">
                <!-- <div class="stat-number">{{.AvgScore}}%</div> -->
                <div class="stat-label">Средний результат</div>
            </div>
            <div class="stat-card">
                <!-- <div class="stat-number">{{.BestScore}}%</div> -->
                <div class="stat-label">Лучший результат</div>
            </div>
        </div>

        <!-- Таблица сессий -->
        <h2 style="margin-bottom: 15px;">📋 История тестов</h2>
